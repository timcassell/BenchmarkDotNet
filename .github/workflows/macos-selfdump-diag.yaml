name: macos-selfdump-diag
on:
  push:
  workflow_dispatch:
jobs:
  diag:
    name: diag (${{ matrix.os }}, ${{ matrix.scenario }})
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-26, macos-15, macos-15-intel ]
        # Each scenario gets a fresh runner, so no earlier hung authorization can affect it.
        scenario: [ A-entitled-first, B-dotnet-first, C-allow-first, D-unentitled-then-entitled ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RESULTS: ${{ github.workspace }}/results
      OUT: repro/bin/Release/net10.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Environment
        run: |
          sw_vers; uname -m; echo "kern.hv_vmm_present=$(sysctl -n kern.hv_vmm_present 2>/dev/null)"
          csrutil status || true; DevToolsSecurity -status || true
          dotnet --list-runtimes | grep NETCore.App
      - name: Build
        run: |
          dotnet build repro -c Release -nologo -v q
          cp "$OUT/SelfDump" "$OUT/SelfDump-entitled"
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict><key>com.apple.security.get-task-allow</key><true/></dict></plist>' > /tmp/gta.plist
          codesign --force -s - --entitlements /tmp/gta.plist "$OUT/SelfDump-entitled"
      - name: Scenario
        run: |
          case "${{ matrix.scenario }}" in
            A-entitled-first)
              ./repro/diag.sh 1-apphost-entitled "$OUT/SelfDump-entitled"
              ./repro/diag.sh 2-dotnet-dll       dotnet "$OUT/SelfDump.dll" ;;
            B-dotnet-first)
              ./repro/diag.sh 1-dotnet-dll       dotnet "$OUT/SelfDump.dll"
              ./repro/diag.sh 2-apphost-entitled "$OUT/SelfDump-entitled" ;;
            C-allow-first)
              sudo security authorizationdb write system.privilege.taskport allow
              ./repro/diag.sh 1-apphost          "$OUT/SelfDump"
              ./repro/diag.sh 2-apphost-entitled "$OUT/SelfDump-entitled" ;;
            D-unentitled-then-entitled)
              ./repro/diag.sh 1-apphost          "$OUT/SelfDump"
              ./repro/diag.sh 2-apphost-entitled "$OUT/SelfDump-entitled" ;;
          esac
      - name: Kill leftovers
        if: always()
        run: sudo pkill -9 createdump || true; sudo pkill -9 SelfDump || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-${{ matrix.os }}-${{ matrix.scenario }}
          path: results
